<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AUTOELITE — Premium Luxury Showroom & Test-Drive Platform</title>
  <meta name="description" content="Experience the Drive. Own the Moment. Explore luxury performance vehicles, interactive 360° studio views, and schedule private test drives.">
  <meta name="theme-color" content="#080A0D">

  <!-- Favicon SVG -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23D6B36A' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpolygon points='12 2 2 7 12 12 22 7 12 2'%3E%3C/polygon%3E%3Cpolyline points='2 17 12 22 22 17'%3E%3C/polyline%3E%3Cpolyline points='2 12 12 17 22 12'%3E%3C/polyline%3E%3C/svg%3E">

  <!-- Google Fonts (Cinzel & Plus Jakarta Sans) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700;800&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">

  <base href="/">

  <!-- Stylesheets -->
  <link rel="stylesheet" href="/assets/css/variables.css">
  <link rel="stylesheet" href="/assets/css/reset.css">
  <link rel="stylesheet" href="/assets/css/global.css">
  <link rel="stylesheet" href="/assets/css/animations.css">
  <link rel="stylesheet" href="/assets/css/components.css">
  <link rel="stylesheet" href="/assets/css/showroom.css">
  <link rel="stylesheet" href="/assets/css/booking.css">
  <link rel="stylesheet" href="/assets/css/dashboard.css">
  <link rel="stylesheet" href="/assets/css/responsive.css">

  <!-- Supabase & Chart.js CDNs -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

  <!-- GLOBAL SITE HEADER (Transparent Hero Navbar with Scroll Transition) -->
  <header class="site-header">
    <div class="container nav-container">
      <a href="/" data-link class="nav-brand">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="color:var(--accent-primary);">
          <polygon points="12 2 2 7 12 12 22 7 12 2"></polygon>
          <polyline points="2 17 12 22 22 17"></polyline>
          <polyline points="2 12 12 17 22 12"></polyline>
        </svg>
        <span class="brand-logo-text">AUTO<span>ELITE</span></span>
      </a>

      <!-- Desktop Navigation Links -->
      <nav class="nav-links">
        <a href="/" data-link class="nav-link">Home</a>
        <a href="/cars" data-link class="nav-link">Explore Cars</a>
        <a href="/compare" data-link class="nav-link">Compare</a>
        <a href="/#about" data-link class="nav-link">About</a>
        <a href="/#contact" data-link class="nav-link">Contact</a>
      </nav>

      <!-- Desktop Dynamic Auth Actions -->
      <div class="nav-actions">
        <div id="nav-auth-actions" style="display:flex;align-items:center;gap:0.75rem;">
          <!-- Dynamically populated by AuthService -->
        </div>
        <a href="/booking" data-link class="btn btn-primary btn-sm">
          Book a Test Drive
        </a>
        <button class="mobile-menu-btn" id="mobile-menu-toggle" aria-label="Open Mobile Menu">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
        </button>
      </div>
    </div>
  </header>

  <!-- MOBILE NAVIGATION DRAWER -->
  <div class="mobile-drawer-backdrop" id="mobile-drawer-backdrop"></div>
  <div class="mobile-drawer" id="mobile-drawer">
    <div class="mobile-drawer-header">
      <span class="brand-logo-text">AUTO<span>ELITE</span></span>
      <button class="modal-close" id="mobile-drawer-close" aria-label="Close Mobile Menu">&times;</button>
    </div>
    <nav class="mobile-drawer-nav">
      <a href="/" data-link class="nav-link">Home</a>
      <a href="/cars" data-link class="nav-link">Explore Cars</a>
      <a href="/compare" data-link class="nav-link">Compare Vehicles</a>
      <a href="/#about" data-link class="nav-link">About Showroom</a>
      <a href="/#contact" data-link class="nav-link">Contact & Location</a>
      <a href="/booking" data-link class="nav-link">Book a Test Drive</a>
    </nav>
    <div class="mobile-drawer-actions" id="mobile-nav-actions">
      <!-- Dynamically populated by AuthService -->
    </div>
  </div>

  <!-- SPA ROOT APP CONTAINER -->
  <main id="app">
    <!-- Router injects active view here -->
  </main>

  <!-- GLOBAL TOAST NOTIFICATIONS ROOT -->
  <div id="toast-container"></div>

  <!-- APP ENTRY MODULE -->
  <script type="module" src="/js/app.js"></script>
</body>
</html>
